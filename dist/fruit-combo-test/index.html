<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>敲敲岛 · 接果子连击版 · 隔离试玩</title><link rel="icon" href="data:,"><link rel="stylesheet" href="style.css"></head>
<body>
<main id="world" role="img" aria-label="全字母接果子场景" tabindex="-1"></main>
<header class="top"><div class="identity"><a href="../game/">← 地图</a><b>全字母接果子</b><small>试玩</small></div><nav aria-label="游戏操作"><button id="speed" aria-haspopup="dialog">进阶 ▾</button><button id="pause">暂停</button></nav></header>
<aside class="stats" aria-label="本局统计"><div class="streak-row"><span>连击 <b id="streak">0</b></span><span>本地最佳 <b id="best">0</b></span></div><div class="counts">接住 <b id="caught">0</b> · 错按 <b id="wrong">0</b> · 漏接 <b id="missed">0</b></div><small id="save-status" role="status" hidden>纪录暂未保存</small></aside>
<p id="feedback" class="hint" aria-live="polite">按果子上的字母接住它</p>
<div id="render-error" class="error" hidden>场景暂时无法显示，请刷新后重试。<a href="../game/">回到地图</a></div>
<dialog id="break-dialog" aria-labelledby="break-title"><h1 id="break-title" tabindex="-1">全字母接果子</h1><p id="break-copy">按果子上的字母接住它。接齐 26 个后继续随机出果。</p>
<fieldset id="speed-options"><legend>选择速度</legend><label><input type="radio" name="speed" value="easy">轻松<small>3.5 秒</small></label><label><input type="radio" name="speed" value="normal" checked>进阶<small>2.5 秒</small></label><label><input type="radio" name="speed" value="hard">挑战<small>1.8 秒</small></label></fieldset>
<p class="record-copy">该档最高连击 <b id="selected-best">0</b><span id="dialog-save-status" hidden> · 纪录暂未保存</span></p><p id="restart-note" hidden>换速会清零本局连击和计数，最高纪录保留。</p>
<button id="resume" class="primary">开始接果子</button><button id="cancel-speed" hidden>取消换速，继续本局</button>
<p class="soft">错按或漏接会中断连击，仍可继续玩。<br>请使用英文输入。试玩纪录独立保存。</p><a href="../game/">回地图</a></dialog>
<script type="module" src="main.js"></script></body></html>
