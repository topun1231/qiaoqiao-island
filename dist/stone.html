<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#b7d590"><title>小熊跳石过河 · 敲敲岛</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="stone.css"></head><body><main class="proposal">
<div id="world" aria-hidden="true"></div><div class="wash"></div>
<header><a class="eyebrow" href="./">‹ 敲敲岛 · 回到冒险地图</a><h1>小熊跳石过河</h1><p id="instruction">看下一块石头，按对字母向前跳一步</p></header>
<div class="top-tools"><button id="pause" hidden>暂停</button><div class="progress"><span class="stone-icon"></span><span>过河进度</span><strong><span id="count">0</span> <i>/ 8</i></strong></div></div>
<div class="gentle"><span id="gentleTitle">慢慢跳，也能到达</span><p id="gentleText">石头会等你，准备好了再出发</p></div>
<footer><div class="hint"><span class="finger-mark"></span><span id="finger">左手食指按 F</span><span class="small-key" data-key="F">F</span><span class="small-key" data-key="J">J</span><span class="hint-divider"></span><span class="secondary">这一关练习 F · J</span><button id="start" class="primary">出发过河 ↵</button></div><div id="feedback" class="feedback" role="status" aria-live="polite"><kbd id="wrongKey"></kbd><span id="wrongText"></span></div><p class="save-note" id="saveNote">本机自动保存 · 请使用实体键盘和英文输入法</p></footer>
<div class="overlay" id="paused" hidden><section role="dialog" aria-modal="true" aria-labelledby="pauseHeading"><h2 id="pauseHeading">小熊在这里等你</h2><p id="pauseText">脚步停下了，准备好再继续</p><button id="resume" class="primary">继续过河</button><a href="./">回到地图</a></section></div>
<div class="overlay finished" id="done" hidden><section role="dialog" aria-modal="true" aria-labelledby="doneHeading"><h2 id="doneHeading">到对岸啦，开始野餐！</h2><p>八块石头，一步一步走过来了</p><button id="replay" class="primary">再过一次河</button><a href="./">回到地图</a></section></div>
<div class="overlay" id="error" hidden><section role="alert"><h2>暂时无法显示3D场景</h2><p>请使用支持 WebGL 的桌面浏览器</p><a href="./">回到地图</a></section></div><div id="announce" class="sr-only" aria-live="polite" aria-atomic="true"></div>
</main><script>if('serviceWorker'in navigator){let refreshed=false;const controlled=!!navigator.serviceWorker.controller;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(controlled&&!refreshed){refreshed=true;location.reload();}});navigator.serviceWorker.register('./sw.js').catch(()=>{});}</script><script type="module" src="stone.js"></script></body></html>
