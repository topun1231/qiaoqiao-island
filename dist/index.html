<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>敲敲岛 · 小熊的键盘冒险</title></head>
<body><p>正在打开敲敲岛…</p><p><a href="./game/">进入正式版</a></p>
<script>
(async()=>{
 // Refresh an existing v8 worker so it cannot return the old map for new game routes.
 try{if('serviceWorker' in navigator){const registration=await navigator.serviceWorker.getRegistration('./');if(registration)await registration.update();}}catch{}
 location.replace('./game/'+location.search+location.hash);
})();
</script></body></html>
