<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>敲敲岛 · 小熊的键盘冒险</title><script defer src="./local-lifecycle.js"></script></head>
<body><p>正在打开敲敲岛…</p><p><a href="./game/">进入正式版</a></p>
<script>
(async()=>{
 if(location.protocol==='file:')return;
 // Retire old page caches without changing player saves.
 try{if('serviceWorker' in navigator){for(const registration of await navigator.serviceWorker.getRegistrations()){
  const path=new URL(registration.scope).pathname;
  if(['/', '/v8/', '/preview/'].includes(path))await registration.unregister();
 }}}catch{}
 try{if('caches' in window){for(const key of await caches.keys()){
  if(key.startsWith('qiaoqiao-island-four-')||key.startsWith('qiaoqiao-variety-preview-'))await caches.delete(key);
 }}}catch{}
 location.replace('./game/'+location.search+location.hash);
})();
</script></body></html>
