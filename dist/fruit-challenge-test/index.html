<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>敲敲岛 · 全字母接果子试玩</title><link rel="stylesheet" href="../game/play.css"><link rel="stylesheet" href="style.css"></head>
<body class="has-task-guide">
<aside class="test-notice"><strong>敲敲岛 · 独立试玩</strong><span>不影响冒险进度 · 本页刷新后重新计数</span></aside>
<header class="top"><a href="../game/">← 冒险地图</a><div><b>自由练习 · 全字母接果子</b><small>随机字母 · 持续挑战</small></div><span class="speed">进阶速度</span><button id="pause">暂停</button></header>
<aside id="task-guide"><strong>看准字母，落地前接住！</strong><span id="task-guide-controls">按下果子上的字母，小熊就会去接</span><small>A–Z 随机轮换，接齐后继续，不设终点</small></aside>
<main id="world" role="img" aria-label="全字母接果子场景" tabindex="-1"><div id="render-error" hidden>场景暂时无法显示，请刷新后重试<br><a href="../game/">回到地图</a></div></main>
<footer class="hintbar"><div class="totals"><span>接住 <b id="caught">0</b></span><span>错按 <b id="wrong">0</b></span><span>漏接 <b id="missed">0</b></span></div><p id="feedback" aria-live="polite">继续看下一颗果子，想休息时点暂停</p></footer>
<dialog id="break-dialog" aria-labelledby="break-title"><h1 id="break-title" tabindex="-1">全字母接果子</h1><p id="break-copy">按果子上的字母，在落地前接住它。<br>全部 26 个字母接齐也会继续出果，没有通关终点。<br>错按、漏接都可以继续；想休息随时暂停。</p><button id="resume" class="primary">开始挑战</button><a href="../game/">回地图</a><p class="soft">请使用英文输入。本页刷新后重新计数。</p></dialog>
<script type="module" src="main.js"></script></body></html>
