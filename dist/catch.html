<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#bdd69a"><title>小熊接果子 · 敲敲岛</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="catch.css"></head><body>
<main class="catch-game"><div id="catchWorld" aria-hidden="true"></div><div class="wash"></div>
<header><a class="eyebrow" href="./">‹ 敲敲岛 · 回到冒险地图</a><h1 id="lessonTitle">小熊接果子</h1><p id="sceneInstruction">按下字母，帮小熊接住果子</p></header>
<div class="top-tools"><button id="pauseCatch" aria-label="暂停练习">暂停</button><div class="harvest"><span>收集果子</span><strong><span id="fruitCount">0</span> <i>/ <span id="fruitTotal">16</span></i></strong></div></div>
<div class="gentle"><b id="gentleTitle">先让手指找到家</b><p id="gentleText">F 用左手食指，J 用右手食指</p></div>
<footer><div id="typedLine" class="typed-line" hidden><span>纸条</span><strong id="typedBuffer"></strong></div><div class="hint"><span class="hint-label">指法提示</span><span id="keyHints"></span><span class="hint-divider"></span><span id="fingerCue">左手食指放在 F 上</span><button class="primary" id="startCatch">开始接果子 ↵</button></div><p id="returnCue" class="return-cue"></p><div class="feedback-line" id="catchFeedback" role="status" aria-live="polite"><kbd id="actualKey"></kbd><span id="feedbackText"></span></div><p class="save-note" id="catchSave">进度保存在本机 · 请使用实体键盘和英文输入法</p></footer>
<div class="overlay" id="catchPause" hidden><section role="dialog" aria-modal="true" aria-labelledby="pauseHeading"><h2 id="pauseHeading">小熊等你回来</h2><p>果子也停下了，准备好再继续</p><button class="primary" id="resumeCatch">继续接果子</button><a href="./">回到地图</a></section></div>
<div class="overlay" id="catchDone" hidden><section role="dialog" aria-modal="true" aria-labelledby="doneHeading"><h2 id="doneHeading">8 个果子，都接住啦！</h2><p id="doneText"></p><p id="accuracyTip"></p><button class="primary" id="replayCatch">再练这一关</button><a href="./">回到地图</a></section></div>
<div class="overlay" id="catchError" hidden><section role="alert"><h2>暂时无法显示 3D 场景</h2><p>请使用支持 WebGL 的桌面浏览器</p><a href="./">回到地图</a></section></div><div class="sr-only" id="catchAnnouncement" aria-live="polite" aria-atomic="true"></div>
</main><script>if('serviceWorker' in navigator){let refreshed=false;const wasControlled=!!navigator.serviceWorker.controller;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(wasControlled&&!refreshed){refreshed=true;location.reload();}});navigator.serviceWorker.register('./sw.js').catch(()=>{});}</script><script type="module" src="catch.js"></script></body></html>
