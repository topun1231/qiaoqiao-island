<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#e9edce">
  <meta name="description" content="敲敲岛：12关自由选择的指法冒险。按字母帮小熊接果子，从F与J到简单英文短句，每关进度自动保存在本机。">
  <title>敲敲岛 · 小熊的键盘冒险</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>
<main id="game" class="home-mode" aria-label="敲敲岛，小熊的键盘冒险">
  <div id="world" aria-hidden="true"></div><div class="vignette"></div>
  <header>
    <button class="title pill" id="mapButton" aria-label="回到冒险地图"><span class="brand">敲敲岛</span><span class="divider"></span><h1>小熊的键盘冒险</h1></button>
    <div class="topright"><button id="keyboardButton" class="round" aria-label="查看键位和指法" title="键位和指法">⌨</button><div class="progress pill" aria-label="已收集成长印章"><span class="reward-icon">🌱</span><span id="count">0</span><span class="total">/ 12</span></div></div>
  </header>
  <div class="map-overlay" id="map">
    <section class="map-board" aria-labelledby="mapHeading">
      <div class="map-top"><div><div class="eyebrow">小熊的键盘冒险 · 12 关自由选择</div><h2 id="mapHeading">把小岛，慢慢变成家</h2><p id="mapIntro">按字母，陪小熊接果子。任选一关，也可以从 F 和 J 开始</p></div><div class="island-score"><span>🌱</span><b id="completedCount">0</b><span>/ 12 枚成长印章</span></div></div>
      <p id="error" class="map-notice" role="alert" hidden>暂时无法显示小岛背景，仍可选择关卡。练习需要支持 WebGL 的桌面浏览器。</p>
      <div class="mode-guide"><span>1—4 接果子</span><span>5—9 跳石过河</span><span>10—11 整理小屋</span><span>12 送邀请信</span></div><a class="stone-entry" href="stone.html"><b>轻松试玩 · F / J 跳石过河</b><span>8块石头的小路线，不计入12关学习记录 →</span></a>
      <nav class="map-grid" id="levelGrid" aria-label="全部十二关，均可自由选择"></nav>
      <div class="map-bottom"><div><p id="saveStatus">每关进度自动保存在这台浏览器</p><span id="offlineStatus">第一次打开需要联网</span></div><div class="map-actions"><button class="text-button" id="collectionButton">我的小岛</button><a class="primary" id="continueButton" href="catch.html?level=1">从第一关出发 →</a></div></div>
      <button class="reset-link" id="resetButton">管理进度</button>
    </section>
  </div>
  <div class="focus-overlay" id="dialog" hidden><section class="dialog-card" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><button class="close-dialog" id="closeDialog" aria-label="关闭">×</button><div id="dialogContent"></div></section></div>
  <div class="toast" id="toast" role="status" hidden></div>
</main>
<script>if('serviceWorker' in navigator){let refreshed=false;const wasControlled=!!navigator.serviceWorker.controller;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(wasControlled&&!refreshed){refreshed=true;location.reload();}});navigator.serviceWorker.register('./sw.js').catch(()=>{});}</script><script type="module" src="main.js"></script>
</body>
</html>
